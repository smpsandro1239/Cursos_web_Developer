<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Playground - Aprende Web</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-color, #020617);
            color: var(--text-primary, #f8fafc);
            min-height: 100vh;
        }
        
        .playground-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .playground-header {
            background: var(--surface-color, #0f172a);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .playground-header h1 {
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .playground-actions {
            display: flex;
            gap: 0.75rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 0.875rem;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: #3b82f6;
            color: white;
        }
        
        .btn-primary:hover { background: #2563eb; }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        
        .editor-area {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.1);
            min-width: 0;
        }
        
        .editor-panel:last-child { border-right: none; }
        
        .editor-tabs {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .editor-tab {
            padding: 0.75rem 1.5rem;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            color: #94a3b8;
        }
        
        .editor-tab.active {
            color: white;
            border-bottom-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }
        
        .editor-tab:hover { color: white; }
        
        .editor-content {
            flex: 1;
            overflow: auto;
        }
        
        .code-editor {
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #e2e8f0;
            border: none;
            padding: 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        
        .code-editor:focus { background: #1e293b; }
        
        .preview-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        
        .preview-header {
            padding: 0.75rem 1rem;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
        }
        
        .preview-content {
            flex: 1;
            overflow: auto;
            background: white;
        }
        
        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .console-panel {
            background: #0f172a;
            border-top: 1px solid rgba(255,255,255,0.1);
            max-height: 200px;
            overflow: auto;
        }
        
        .console-header {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .console-output {
            padding: 0.75rem 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
        }
        
        .console-line {
            margin-bottom: 0.25rem;
        }
        
        .console-log { color: #e2e8f0; }
        .console-warn { color: #fbbf24; }
        .console-error { color: #ef4444; }
        
        .hidden { display: none; }

        .challenge-description {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid #3b82f6;
            padding: 0.75rem 1rem;
            margin: 0.5rem 1rem;
            font-size: 0.85rem;
            color: #94a3b8;
            border-radius: 0 0.5rem 0.5rem 0;
        }
        
        @media (max-width: 768px) {
            .editor-area { flex-direction: column; }
            .editor-panel { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            .preview-panel { flex: none; height: 50vh; }
        }
    </style>
</head>
<body>
    <div class="playground-container">
        <header class="playground-header">
            <h1>🎮 Code Playground</h1>
            <div class="playground-actions">
                <a href="#" id="back-to-course" class="btn btn-secondary" style="display:none; text-decoration:none;">⬅ Voltar ao Curso</a>
                <button class="btn btn-secondary" onclick="resetCode()">🔄 Reset</button>
                <button class="btn btn-secondary" onclick="saveCode()">💾 Guardar</button>
                <button class="btn btn-primary" onclick="runCode()">▶️ Executar</button>
            </div>
        </header>
        
        <div class="editor-area">
            <div class="editor-panel">
                <div class="editor-tabs">
                    <div class="editor-tab active" data-tab="html">HTML</div>
                    <div class="editor-tab" data-tab="css">CSS</div>
                    <div class="editor-tab" data-tab="js">JavaScript</div>
                </div>
                <div class="editor-content">
                    <textarea id="html-editor" class="code-editor" spellcheck="false" placeholder="Escreve o teu HTML aqui..."></textarea>
                    <textarea id="css-editor" class="code-editor hidden" spellcheck="false" placeholder="Escreve o teu CSS aqui..."></textarea>
                    <textarea id="js-editor" class="code-editor hidden" spellcheck="false" placeholder="Escreve o teu JavaScript aqui..."></textarea>
                </div>
            </div>
            
            <div class="preview-panel">
                <div class="preview-header">📺 Pré-visualização</div>
                <div class="preview-content">
                    <iframe id="preview-iframe" class="preview-iframe"></iframe>
                </div>
            </div>
        </div>
        
        <div class="console-panel">
            <div class="console-header">
                <span>🖥️ Console</span>
                <button class="btn btn-secondary" style="padding: 0.25rem 0.5rem; font-size: 0.7rem;" onclick="clearConsole()">Limpar</button>
            </div>
            <div id="console-output" class="console-output"></div>
        </div>
    </div>

    <script>
        const htmlEditor = document.getElementById('html-editor');
        const cssEditor = document.getElementById('css-editor');
        const jsEditor = document.getElementById('js-editor');
        const previewIframe = document.getElementById('preview-iframe');
        const consoleOutput = document.getElementById('console-output');

        // === Challenge mode ===
        const urlParams = new URLSearchParams(window.location.search);
        const challengeId = urlParams.get('challenge');
        let challengeData = null;
        let currentSolution = null;

        if (challengeId) {
            const stored = localStorage.getItem('challenge_' + challengeId);
            if (stored) {
                challengeData = JSON.parse(stored);
                currentSolution = challengeData.solution || null;
                document.querySelector('.playground-header h1').innerHTML = '\u{1F3AE} ' + (challengeData.title || 'Desafio');
            }
        }

        // === Default code ===
        const defaultHTML = '<!DOCTYPE html>\n<html lang="pt-PT">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Meu Projeto</title>\n</head>\n<body>\n    <h1>Ol\u00E1 Mundo! \u{1F44B}</h1>\n    <p>Escreve o teu c\u00F3digo e clica em "Executar"!</p>\n    <button onclick="dizerOla()">Clica-me!</button>\n    <div id="resultado"></div>\n</body>\n</html>';

        const defaultCSS = 'body {\n    font-family: Arial, sans-serif;\n    padding: 2rem;\n    background: #f0f0f0;\n    color: #333;\n}\n\nh1 {\n    color: #2563eb;\n}\n\nbutton {\n    background: #2563eb;\n    color: white;\n    border: none;\n    padding: 0.75rem 1.5rem;\n    border-radius: 0.5rem;\n    cursor: pointer;\n    font-size: 1rem;\n}\n\nbutton:hover {\n    background: #1d4ed8;\n}';

        const defaultJS = 'function dizerOla() {\n    var resultado = document.getElementById("resultado");\n    resultado.innerHTML = "<p style=\\"color: green; margin-top: 1rem;\\">\u{1F389} Ol\u00E1! Bem-vindo ao Code Playground!</p>";\n    console.log("Ol\u00E1 do Code Playground!");\n}';

        // Load code
        if (challengeData) {
            htmlEditor.value = challengeData.html || defaultHTML;
            cssEditor.value = challengeData.css || defaultCSS;
            jsEditor.value = challengeData.js || '';
        } else {
            htmlEditor.value = localStorage.getItem('playground-html') || defaultHTML;
            cssEditor.value = localStorage.getItem('playground-css') || defaultCSS;
            jsEditor.value = localStorage.getItem('playground-js') || defaultJS;
        }

        // Show back button + description in challenge mode
        if (challengeData) {
            var backBtn = document.getElementById('back-to-course');
            backBtn.style.display = 'inline-block';
            backBtn.href = document.referrer || '#';
            if (challengeData.description) {
                consoleLog('\u{1F4CB} Desafio: ' + challengeData.description, 'info');
            }
        }

        // Tab switching
        document.querySelectorAll('.editor-tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.editor-tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                document.querySelectorAll('.code-editor').forEach(function(e) { e.classList.add('hidden'); });
                var tabName = tab.dataset.tab;
                document.getElementById(tabName + '-editor').classList.remove('hidden');
            });
        });

        // Run code
        function runCode() {
            var html = htmlEditor.value;
            var css = cssEditor.value;
            var js = jsEditor.value;
            var iframeDoc = previewIframe.contentDocument || previewIframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(
                '<!DOCTYPE html><html><head><style>' + css + '</style></head><body>' +
                html.replace(/<style>[\s\S]*?<\/style>/g, '').replace(/<script>[\s\S]*?<\/script>/g, '') +
                '<scr' + 'ipt>window.onerror=function(m,u,l){parent.consoleError(m+" (linha "+l+")");return true;};' +
                js + '</scr' + 'ipt></body></html>'
            );
            iframeDoc.close();
            consoleLog('\u25B6\uFE0F C\u00F3digo executado', 'info');
        }

        // Save code
        function saveCode() {
            localStorage.setItem('playground-html', htmlEditor.value);
            localStorage.setItem('playground-css', cssEditor.value);
            localStorage.setItem('playground-js', jsEditor.value);
            consoleLog('\u{1F4BE} C\u00F3digo guardado!', 'info');
        }

        // Reset code
        function resetCode() {
            if (confirm('Queres resetar todo o c\u00F3digo? Esta a\u00E7\u00E3o n\u00E3o pode ser revertida.')) {
                if (challengeData) {
                    htmlEditor.value = challengeData.html || defaultHTML;
                    cssEditor.value = challengeData.css || defaultCSS;
                    jsEditor.value = challengeData.js || '';
                } else {
                    htmlEditor.value = defaultHTML;
                    cssEditor.value = defaultCSS;
                    jsEditor.value = defaultJS;
                    localStorage.removeItem('playground-html');
                    localStorage.removeItem('playground-css');
                    localStorage.removeItem('playground-js');
                }
                runCode();
                consoleLog('\u{1F504} C\u00F3digo resetado!', 'info');
            }
        }

        // Solution reveal
        if (currentSolution) {
            var actionsDiv = document.querySelector('.playground-actions');
            var solBtn = document.createElement('button');
            solBtn.className = 'btn btn-secondary';
            solBtn.innerHTML = '\u{1F440} Ver Solu\u00E7\u00E3o';
            solBtn.dataset.revealed = 'false';
            solBtn.addEventListener('click', function() {
                if (solBtn.dataset.revealed === 'true') {
                    solBtn.dataset.revealed = 'false';
                    solBtn.innerHTML = '\u{1F440} Ver Solu\u00E7\u00E3o';
                    htmlEditor.value = challengeData.html || defaultHTML;
                    cssEditor.value = challengeData.css || defaultCSS;
                    jsEditor.value = challengeData.js || '';
                    runCode();
                    consoleLog('\u{1F519} C\u00F3digo original restaurado', 'info');
                } else {
                    solBtn.dataset.revealed = 'true';
                    solBtn.innerHTML = '\u{1F519} Voltar ao Meu C\u00F3digo';
                    var sol = currentSolution.trim();
                    if (sol.indexOf('<!DOCTYPE') === 0 || sol.indexOf('<html') === 0) {
                        htmlEditor.value = sol;
                    } else if (sol.indexOf('function') === 0 || sol.indexOf('const ') === 0 || sol.indexOf('let ') === 0) {
                        jsEditor.value = sol;
                    } else {
                        htmlEditor.value = challengeData.html || defaultHTML;
                        htmlEditor.value = htmlEditor.value.replace('<!-- Escreve o teu c\u00F3digo HTML aqui \u{1F447} -->', sol);
                    }
                    runCode();
                    consoleLog('\u{1F440} Solu\u00E7\u00E3o revelada!', 'info');
                }
            });
            actionsDiv.insertBefore(solBtn, actionsDiv.firstChild);
        }

        // Console
        function consoleLog(message, type) {
            type = type || 'log';
            var line = document.createElement('div');
            line.className = 'console-line console-' + type;
            line.textContent = '> ' + message;
            consoleOutput.appendChild(line);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        window.consoleError = function(message) {
            consoleLog(message, 'error');
        };

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'console') {
                consoleLog(event.data.message, event.data.level);
            }
        });

        function clearConsole() {
            consoleOutput.innerHTML = '';
        }

        runCode();
    </script>
</body>
</html>
